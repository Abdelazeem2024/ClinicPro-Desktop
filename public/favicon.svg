<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A7CFF"/>
      <stop offset="100%" stop-color="#0056D6"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F4FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#003399" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer circle with soft shadow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Inner subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>
  
  <!-- Elegant medical cross -->
  <g filter="url(#innerGlow)">
    <!-- Vertical bar -->
    <rect x="206" y="120" width="100" height="272" rx="28" ry="28" fill="url(#crossGrad)"/>
    <!-- Horizontal bar -->
    <rect x="120" y="206" width="272" height="100" rx="28" ry="28" fill="url(#crossGrad)"/>
  </g>
  
  <!-- Subtle highlight on top of cross -->
  <rect x="216" y="130" width="80" height="30" rx="12" ry="12" fill="rgba(255,255,255,0.35)"/>
  
  <!-- Small elegant accent dots -->
  <circle cx="256" cy="256" r="12" fill="rgba(255,255,255,0.9)"/>
</svg>
