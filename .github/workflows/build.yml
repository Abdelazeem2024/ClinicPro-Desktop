name: Build Windows App

# يعمل تلقائيًا مع كل رفع (push) على الفرع main، أو يدويًا من تبويب Actions
# بالضغط على "Run workflow".
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الحزم
        run: npm install

      - name: بناء وتغليف البرنامج (electron-builder)
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: رفع ملف التثبيت الناتج
        uses: actions/upload-artifact@v4
        with:
          name: ClinicPro-Windows-Installer
          path: |
            release/*.exe
          if-no-files-found: error
